<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04362f" />
    <meta name="color-scheme" content="light dark" />
    <!-- Applies a saved light/dark choice before first paint, so the page never
         flashes the wrong theme. No saved choice means "follow the OS", which
         index.css handles with prefers-color-scheme. Keep the key in step with
         THEME_STORAGE_KEY in src/theme/theme.ts. -->
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem('4prep-theme');
          if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
        } catch (error) {}
      })();
    </script>
    <meta name="description" content="4Prep — clear, source-backed university pathways for international students." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="4Prep — Find your path abroad" />
    <meta property="og:description" content="Clear, source-backed university pathways for international students." />
    <meta property="og:image" content="/brand/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <title>4Prep — Find your path abroad</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
